name: ContractFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/ContractFlow.Api/ContractFlow.Api.csproj

      - name: Build
        run: dotnet build backend/ContractFlow.Api/ContractFlow.Api.csproj --configuration Release --no-restore

      - name: Tests
        run: dotnet test backend/ContractFlow.Tests/ContractFlow.Tests.csproj --configuration Release

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/contractflow-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/contractflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build